[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-cc-switch-history-sync"
version = "2.0.0"
description = "Cross-platform Codex session history sync for cc-switch provider switches"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
codex-history-sync = "codex_history_sync.cli:main"

[tool.setuptools]
packages = ["codex_history_sync"]
