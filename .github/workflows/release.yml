name: build-and-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system Tcl/Tk + file (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk file

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Smoke test source
        shell: bash
        run: |
          python -c "import codex_history_sync"
          python -c "import tkinter, _tkinter; print('tkinter', tkinter.TkVersion)"
          python main.py --help

      - name: Build single-file binary
        shell: bash
        run: |
          ICON_ARGS=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            ICON_ARGS="--icon icons/icon.ico"
          fi
          python -m PyInstaller --onefile --clean --noconfirm $ICON_ARGS \
            --name codex-history-sync main.py

      - name: Smoke test binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/codex-history-sync.exe --help
          else
            ./dist/codex-history-sync --help
          fi

      # ------------------------------------------------------------------ #
      # Windows: bare portable .exe
      # ------------------------------------------------------------------ #
      - name: Package Windows exe
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p assets
          cp dist/codex-history-sync.exe \
            "assets/codex-history-sync-${{ github.ref_name }}-windows-x64.exe"

      # ------------------------------------------------------------------ #
      # macOS: .dmg containing an ad-hoc signed .app bundle
      # ------------------------------------------------------------------ #
      - name: Package macOS dmg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          APP="CodexHistorySync.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp dist/codex-history-sync "$APP/Contents/MacOS/codex-history-sync"
          cp icons/icon.icns "$APP/Contents/Resources/icon.icns"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Codex History Sync</string>
            <key>CFBundleDisplayName</key>
            <string>Codex History Sync</string>
            <key>CFBundleIdentifier</key>
            <string>com.codex.history-sync</string>
            <key>CFBundleExecutable</key>
            <string>codex-history-sync</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleIconFile</key>
            <string>icon.icns</string>
            <key>CFBundleVersion</key>
            <string>$VERSION</string>
            <key>CFBundleShortVersionString</key>
            <string>$VERSION</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "$APP"
          mkdir -p dmg_staging assets
          cp -R "$APP" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "Codex History Sync" \
            -srcfolder dmg_staging -ov -format UDZO \
            "assets/codex-history-sync-${{ github.ref_name }}-macos-arm64.dmg"

      # ------------------------------------------------------------------ #
      # Linux: .AppImage
      # ------------------------------------------------------------------ #
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          APPDIR="codex-history-sync.AppDir"
          mkdir -p "$APPDIR"
          cp dist/codex-history-sync "$APPDIR/"

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          exec "$APPDIR/codex-history-sync" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          cat > "$APPDIR/codex-history-sync.desktop" <<'EOF'
          [Desktop Entry]
          Name=Codex History Sync
          Exec=codex-history-sync
          Icon=codex-history-sync
          Type=Application
          Categories=Utility;
          Comment=Sync Codex session history across cc-switch providers
          EOF

          cp icons/icon.png "$APPDIR/codex-history-sync.png"

          mkdir -p assets
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./appimagetool "$APPDIR" \
            "assets/codex-history-sync-${{ github.ref_name }}-linux-x64.AppImage"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
